version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=LmsDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourSecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Lms.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=database;Database=LmsDb;Username=postgres;Password=YourSecurePassword123!
      - UseSQLite=false
      - Jwt__Key=YourSuperSecretProductionSigningKeyHere!!!
      - Jwt__Issuer=LmsServer
      - Jwt__Audience=LmsClient
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - database

  frontend-web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-api

volumes:
  db-data:
